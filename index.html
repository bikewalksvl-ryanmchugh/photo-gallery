<!DOCTYPE html>
<html>
  <head>
    <style>
      body { margin: 0; font-family: sans-serif; background-color: #f5f5f5; }
      #lightgallery {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        justify-content: center;
        padding: 1rem;
        max-width: 1400px;
        margin: 0 auto;
      }
      #lightgallery .photo-item {
        width: 240px;
        height: 240px;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        border-radius: 8px;
        overflow: hidden;
      }
      img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #status {
        text-align: center;
        padding: 2rem;
        font-size: 1.2rem;
        color: #666;
      }
    </style>
    <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/css/lightgallery-bundle.min.css" />
  </head>
  <body>
    <div id="status">Loading gallery...</div>
    <div id="lightgallery">
    </div>

    <script>
      (function () {
        // Visible diagnostic log — appends to the status div so you can see
        // exactly what's happening without needing DevTools frame selection.
        var _log = (function () {
          var status = document.getElementById('status');
          return function (msg) {
            var div = document.createElement('div');
            div.style.fontSize = '0.85rem';
            div.style.color = '#888';
            div.style.marginTop = '4px';
            div.style.fontFamily = 'monospace';
            div.textContent = '[diag] ' + msg;
            status.parentNode.insertBefore(div, status.nextSibling);
          };
        })();

        _log('page loaded');

        function showStatus(msg) {
          var status = document.getElementById('status');
          status.style.display = 'block';
          status.innerText = msg;
        }

        // Check that google.script.run exists (it won't if the page is
        // loaded as a raw file or from a different context).
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          showStatus('Error: google.script.run is not available. '
            + 'This page must be opened via the deployed web app URL '
            + '(script.google.com/macros/s/.../exec), not the editor preview.');
          return;
        }

        _log('google.script.run exists, calling getPhotos...');

        var called = false;
        google.script.run
          .withSuccessHandler(function(photos) {
            _log('SUCCESS: got ' + photos.length + ' photos');
            called = true;
            var gallery = document.getElementById('lightgallery');
            var status = document.getElementById('status');
            status.style.display = 'none';

            if (!photos || photos.length === 0) {
              status.style.display = 'block';
              status.innerText = 'No images found in the folder.';
              return;
            }

            // First loop (commented out)
            /*
            photos.forEach(function(photo) {
              var item = document.createElement('div');
              item.className = 'photo-item';

              var img = document.createElement('img');
              img.src = photo.dataUri;
              img.loading = 'lazy';

              item.appendChild(img);
              gallery.appendChild(item);
            });
            */

            photos.forEach((photo) => {
              var item = document.createElement('div');
              item.className = 'photo-item';

              var anchor = document.createElement('a');
              anchor.href = photo.thumbnailUrl;
              anchor.setAttribute('data-src', photo.thumbnailUrl);
              anchor.setAttribute('data-size', '1920x1080');
              anchor.setAttribute('data-sub-html', photo.name);
              anchor.classList.add('lg-item');

              var img = document.createElement('img');
              img.src = photo.thumbnailUrl;
              img.loading = 'lazy';
              img.alt = photo.name;
              img.title = photo.name;
              img.setAttribute('data-src', photo.thumbnailUrl)

              anchor.appendChild(img);
              item.appendChild(anchor);

              let gallery = document.getElementById("lightgallery");
              gallery.appendChild(item);
            });

            // Initialize lightgallery after elements are added to DOM
            setTimeout(function() {
              lightGallery(gallery, {
                selector: 'a',
                plugins: [lgZoom, lgThumbnail],
                forceImageType: true,
                licenseKey: 'none',
                speed: 500,
                thumbnail: true,
                zoom: true
              });
            }, 200);
          })
          .withFailureHandler(function(err) {
            _log('FAILURE: ' + (err && err.message ? err.message : err));
            called = true;
            showStatus('Error loading gallery: ' + (err && err.message ? err.message : err));
          })
          .getPhotos();
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/lightgallery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/plugins/thumbnail/lg-thumbnail.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/plugins/zoom/lg-zoom.min.js"></script>
  </body>
</html>

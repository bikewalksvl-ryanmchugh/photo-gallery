<!DOCTYPE html>
<html>
  <head>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: sans-serif;
        background-color: #f5f5f5;
      }
      #loading {
        text-align: center;
        padding: 3rem;
        font-size: 1.2rem;
        color: #666;
      }
      #lightgallery {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        padding: 1rem;
        max-width: 1600px;
        margin: 0 auto;
      }
      #lightgallery .photo-item {
        width: 240px;
        height: 240px;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        cursor: pointer;
      }
      #lightgallery .photo-item:hover {
        transform: scale(1.03);
        box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      }
      #lightgallery .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Responsive breakpoints */
      @media (max-width: 1600px) {
        #lightgallery .photo-item { width: 200px; height: 200px; }
      }
      @media (max-width: 1200px) {
        #lightgallery .photo-item { width: 160px; height: 160px; }
      }
      @media (max-width: 800px) {
        #lightgallery .photo-item { width: 120px; height: 120px; gap: 0.5rem; }
        #lightgallery { padding: 0.5rem; gap: 0.5rem; }
      }
      @media (max-width: 480px) {
        #lightgallery .photo-item { width: calc(50% - 1rem); height: calc(50% - 1rem); max-height: 200px; }
      }
    </style>
    <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/css/lightgallery-bundle.min.css" />
  </head>
  <body>
    <div id="loading">Loading gallery...</div>
    <div id="lightgallery"></div>

    <script>
      (function () {
        var loading = document.getElementById('loading');
        var gallery = document.getElementById('lightgallery');

        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          loading.innerText = 'Error: This page must be opened via the deployed web app URL.';
          return;
        }

        google.script.run
          .withSuccessHandler(function(photos) {
            loading.style.display = 'none';

            if (!photos || photos.length === 0) {
              loading.style.display = 'block';
              loading.innerText = 'No images found in the folder.';
              return;
            }

            photos.forEach(function(photo) {
              var item = document.createElement('div');
              item.className = 'photo-item';

              var anchor = document.createElement('a');
              anchor.href = photo.thumbnailUrl;
              anchor.setAttribute('data-src', photo.thumbnailUrl);
              anchor.setAttribute('data-size', '1920x1080');
              anchor.setAttribute('data-sub-html', photo.name);
              anchor.classList.add('lg-item');

              var img = document.createElement('img');
              img.src = photo.thumbnailUrl;
              img.loading = 'lazy';
              img.alt = photo.name;
              img.title = photo.name;

              anchor.appendChild(img);
              item.appendChild(anchor);
              gallery.appendChild(item);
            });

            // Initialize lightgallery after elements are added to DOM
            setTimeout(function() {
              lightGallery(gallery, {
                selector: 'a',
                plugins: [lgZoom, lgThumbnail],
                forceImageType: true,
                licenseKey: 'none',
                speed: 500,
                thumbnail: true,
                zoom: true
              });
            }, 200);
          })
          .withFailureHandler(function(err) {
            loading.style.display = 'block';
            loading.innerText = 'Error loading gallery: ' + (err && err.message ? err.message : err);
          })
          .getPhotos();
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/lightgallery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/plugins/thumbnail/lg-thumbnail.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/plugins/zoom/lg-zoom.min.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: sans-serif;
        background-color: #f5f5f5;
      }
      #gallery-header {
        font-family: 'Oswald', sans-serif;
        font-size: 24px;
        font-weight: 500;
        text-align: center;
        color: #125531;
        margin: 1.5rem 0 0;
        padding: 0 1rem;
      }
      #filters {
        /* Wraps onto extra rows on narrow screens instead of overflowing. */
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.5rem 1.25rem;
        max-width: 1600px;
        margin: 1rem auto 0;
        padding: 0 1rem;
      }
      #filters .filter-group {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }
      #filters .filter-pill {
        font-family: inherit;
        font-size: 14px;
        line-height: 1;
        padding: 0.5rem 0.95rem;
        border: 1px solid #125531;
        border-radius: 999px;
        background-color: #fff;
        color: #125531;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }
      #filters .filter-pill.tag {
        border-color: #a9bcb0;
        background-color: #fafcfa;
        color: #3c4a42;
        font-size: 13px;
      }
      #filters .filter-pill:hover {
        background-color: #f0f6f2;
      }
      #filters .filter-pill.active {
        background-color: #ffda66;
        border-color: #ffda66;
        color: #125531;
      }
      #clear-filters {
        font-family: inherit;
        font-size: 14px;
        padding: 0.5rem 0.25rem;
        border: none;
        background: none;
        color: #125531;
        text-decoration: underline;
        cursor: pointer;
        white-space: nowrap;
      }
      #clear-filters[disabled] {
        color: #9aa5a0;
        text-decoration: none;
        cursor: default;
      }
      #loading {
        text-align: center;
        padding: 3rem;
        font-size: 1.2rem;
        color: #666;
      }
      #lightgallery {
        /* Responsive square-tile grid: columns auto-shrink with the iframe width
           so aspect ratio stays correct (no more "crushed") and more photos fit. */
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
        padding: 1rem;
        max-width: 1600px;
        margin: 0 auto;
        /* Sensible minimum height so the gallery never looks cramped. */
        min-height: 60vh;
      }
      #lightgallery .photo-item {
        position: relative;
        width: 100%;
        height: 0;
        padding-bottom: 100%; /* keeps each tile a responsive square */
        background-color: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        cursor: pointer;
      }
      #lightgallery .photo-item:hover {
        transform: scale(1.03);
        box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      }
      #lightgallery .photo-item a.lg-item {
        position: absolute;
        inset: 0;
      }
      #lightgallery .photo-item img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/css/lightgallery-bundle.min.css" />
  </head>
  <body>
    <h1 id="gallery-header">Photo Gallery</h1>
    <div id="filters"></div>
    <div id="loading">Loading gallery...</div>
    <div id="lightgallery"></div>

    <script>
      (function () {
        var loading = document.getElementById('loading');
        var gallery = document.getElementById('lightgallery');
        var filtersBar = document.getElementById('filters');

        var allPhotos = [];
        var selectedYears = {};
        var selectedTags = {};
        var lgInstance = null;

        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          loading.innerText = 'Error: This page must be opened via the deployed web app URL.';
          return;
        }

        // Year a photo was created, or null when no usable date exists.
        function photoYear(photo) {
          if (!photo.createdAt) return null;
          var d = new Date(photo.createdAt);
          return isNaN(d.getTime()) ? null : String(d.getFullYear());
        }

        function hasActiveFilters() {
          return Object.keys(selectedYears).length > 0 || Object.keys(selectedTags).length > 0;
        }

        function buildPill(label, active, extraClass, onClick) {
          var pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'filter-pill' + (extraClass ? ' ' + extraClass : '') + (active ? ' active' : '');
          pill.textContent = label;
          pill.setAttribute('aria-pressed', active ? 'true' : 'false');
          pill.addEventListener('click', onClick);
          return pill;
        }

        function buildGroup(label) {
          var group = document.createElement('div');
          group.className = 'filter-group';
          group.setAttribute('role', 'group');
          group.setAttribute('aria-label', label);
          return group;
        }

        function renderFilters() {
          filtersBar.innerHTML = '';

          var yearCounts = {};
          var tagLabels = {};
          allPhotos.forEach(function (photo) {
            var year = photoYear(photo);
            if (year) yearCounts[year] = true;
            (photo.tags || []).forEach(function (tag) {
              tagLabels[tag.toLowerCase()] = tag;
            });
          });

          // Newest year first; tags alphabetically.
          var years = Object.keys(yearCounts).sort(function (a, b) { return b - a; });
          var tagKeys = Object.keys(tagLabels).sort();

          if (years.length > 0) {
            var yearGroup = buildGroup('Filter by year');
            years.forEach(function (year) {
              yearGroup.appendChild(buildPill(year, !!selectedYears[year], '', function () {
                if (selectedYears[year]) delete selectedYears[year];
                else selectedYears[year] = true;
                renderFilters();
                renderGallery();
              }));
            });
            filtersBar.appendChild(yearGroup);
          }

          if (tagKeys.length > 0) {
            var tagGroup = buildGroup('Filter by tag');
            tagKeys.forEach(function (key) {
              tagGroup.appendChild(buildPill(tagLabels[key], !!selectedTags[key], 'tag', function () {
                if (selectedTags[key]) delete selectedTags[key];
                else selectedTags[key] = true;
                renderFilters();
                renderGallery();
              }));
            });
            filtersBar.appendChild(tagGroup);
          }

          if (years.length > 0 || tagKeys.length > 0) {
            var clear = document.createElement('button');
            clear.type = 'button';
            clear.id = 'clear-filters';
            clear.textContent = 'Clear filters';
            clear.disabled = !hasActiveFilters();
            clear.addEventListener('click', function () {
              selectedYears = {};
              selectedTags = {};
              renderFilters();
              renderGallery();
            });
            filtersBar.appendChild(clear);
          }
        }

        function renderGallery() {
          var filterByYear = Object.keys(selectedYears).length > 0;
          var filterByTag = Object.keys(selectedTags).length > 0;

          // Year and tag filters combine (AND): a photo must satisfy both.
          var filtered = allPhotos.filter(function (photo) {
            if (filterByYear) {
              var year = photoYear(photo);
              if (!year || !selectedYears[year]) return false;
            }
            if (filterByTag) {
              var matchesTag = (photo.tags || []).some(function (tag) {
                return !!selectedTags[tag.toLowerCase()];
              });
              if (!matchesTag) return false;
            }
            return true;
          });

          if (lgInstance) {
            lgInstance.destroy();
            lgInstance = null;
          }
          gallery.innerHTML = '';

          if (filtered.length === 0) {
            loading.style.display = 'block';
            loading.innerText = allPhotos.length === 0
              ? 'No images found in the folder.'
              : 'No photos match the selected filters.';
            return;
          }

          loading.style.display = 'none';

          filtered.forEach(function(photo) {
            var item = document.createElement('div');
            item.className = 'photo-item';

            var anchor = document.createElement('a');
            anchor.href = photo.thumbnailUrl;
            anchor.setAttribute('data-src', photo.thumbnailUrl);
            anchor.setAttribute('data-size', '1920x1080');
            anchor.setAttribute('data-sub-html', photo.name);
            anchor.classList.add('lg-item');

            var img = document.createElement('img');
            img.src = photo.thumbnailUrl;
            img.loading = 'lazy';
            img.alt = photo.name;
            img.title = photo.name;

            anchor.appendChild(img);
            item.appendChild(anchor);
            gallery.appendChild(item);
          });

          // (Re)initialize lightgallery after elements are added to DOM
          setTimeout(function() {
            lgInstance = lightGallery(gallery, {
              selector: 'a',
              plugins: [lgZoom, lgThumbnail],
              forceImageType: true,
              licenseKey: 'none',
              speed: 500,
              thumbnail: true,
              zoom: true
            });
          }, 150);
        }

        google.script.run
          .withSuccessHandler(function(photos) {
            allPhotos = (photos || []).slice().sort(function (a, b) {
              var da = a.createdAt ? new Date(a.createdAt).getTime() : 0;
              var db = b.createdAt ? new Date(b.createdAt).getTime() : 0;
              return db - da; // newest first
            });

            renderFilters();
            renderGallery();
          })
          .withFailureHandler(function(err) {
            loading.style.display = 'block';
            loading.innerText = 'Error loading gallery: ' + (err && err.message ? err.message : err);
          })
          .getPhotos();
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/lightgallery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/plugins/thumbnail/lg-thumbnail.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.9.0/plugins/zoom/lg-zoom.min.js"></script>

    <!-- Loading iframe-resizer in this iframe content page makes the page
         auto-report its full content height to the parent (Google Site), so the
         embedded iframe can grow/shrink to fit — fixing "crushed" + "very little
         to show". The parent side must call iframeResizer() (done in the Google
         Site embed via a Code Snippet). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.1/iframeResizer.min.js"></script>
  </body>
</html>
